name: ci
on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        # both platforms the words name -- linux on ubuntu, darwin on
        # macOS -- each with both compilers the project builds with
        # (issue #117): a test that holds on one platform only goes
        # red the hour it lands, not at the next hand-run make test
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: make fmt-check
        if: runner.os == 'Linux' # the macos image carries no
                                 # clang-format, and a format verdict
                                 # is version-sensitive -- one
                                 # platform, one version, one answer
      - run: make qbe/qbe
      - run: make CC=${{ matrix.cc }}
      - run: make test
